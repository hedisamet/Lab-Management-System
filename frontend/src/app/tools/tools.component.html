<div fxLayout="row" fxLayoutAlign="end center" style="margin: 16px;">
  <button mat-raised-button color="primary" (click)="openForm()">
    <mat-icon>add</mat-icon>
    Add Tool
  </button>
</div>

<div *ngIf="showForm" style="padding: 16px; max-width: 500px;">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="fill" style="width: 100%; margin-bottom: 8px;">
      <mat-label>Source</mat-label>
      <input matInput formControlName="source" placeholder="Source URL or name">
      <mat-error *ngIf="form.get('source')?.hasError('required')">Source is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" style="width: 100%; margin-bottom: 8px;">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date" placeholder="Pick a date">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="form.get('date')?.hasError('required')">Date is required</mat-error>
    </mat-form-field>

    <div fxLayout="row" fxLayoutGap="8px">
      <button mat-raised-button color="primary" type="submit" [disabled]="!form.valid">
        {{ editingId ? 'Update' : 'Save' }}
      </button>
      <button mat-button type="button" (click)="closeForm()">Cancel</button>
    </div>
  </form>
</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
  </ng-container>

  <ng-container matColumnDef="source">
    <th mat-header-cell *matHeaderCellDef>Source</th>
    <td mat-cell *matCellDef="let element">{{ element.source }}</td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let element">{{ element.date }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button color="primary" (click)="openForm(element)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="delete(element.id)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="4" style="text-align: center; padding: 16px;">No tools found.</td>
  </tr>
</table>

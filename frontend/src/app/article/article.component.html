<div fxLayout="row" fxLayoutAlign="end center" style="margin: 16px;">
  <button mat-raised-button color="primary" (click)="openForm()">
    <mat-icon>add</mat-icon>
    Add Publication
  </button>
</div>

<div *ngIf="showForm" style="padding: 16px; max-width: 600px;">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="fill" style="width: 100%; margin-bottom: 8px;">
      <mat-label>Titre</mat-label>
      <input matInput formControlName="titre" placeholder="Publication title">
      <mat-error *ngIf="form.get('titre')?.hasError('required')">Titre is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" style="width: 100%; margin-bottom: 8px;">
      <mat-label>Type</mat-label>
      <mat-select formControlName="type">
        <mat-option *ngFor="let t of publicationTypes" [value]="t">{{ t | titlecase }}</mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('type')?.hasError('required')">Type is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" style="width: 100%; margin-bottom: 8px;">
      <mat-label>Lien (URL)</mat-label>
      <input matInput formControlName="lien" placeholder="https://...">
      <mat-error *ngIf="form.get('lien')?.hasError('required')">Lien is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" style="width: 100%; margin-bottom: 8px;">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date" placeholder="Pick a date">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="form.get('date')?.hasError('required')">Date is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" style="width: 100%; margin-bottom: 8px;">
      <mat-label>Source PDF</mat-label>
      <input matInput formControlName="sourcepdf" placeholder="PDF link or filename">
    </mat-form-field>

    <div fxLayout="row" fxLayoutGap="8px">
      <button mat-raised-button color="primary" type="submit" [disabled]="!form.valid">
        {{ editingId ? 'Update' : 'Save' }}
      </button>
      <button mat-button type="button" (click)="closeForm()">Cancel</button>
    </div>
  </form>
</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
  </ng-container>

  <ng-container matColumnDef="titre">
    <th mat-header-cell *matHeaderCellDef>Titre</th>
    <td mat-cell *matCellDef="let element">{{ element.titre }}</td>
  </ng-container>

  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>Type</th>
    <td mat-cell *matCellDef="let element">{{ element.type }}</td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let element">{{ element.date }}</td>
  </ng-container>

  <ng-container matColumnDef="lien">
    <th mat-header-cell *matHeaderCellDef>Lien</th>
    <td mat-cell *matCellDef="let element">
      <a [href]="element.lien" target="_blank">
        <mat-icon>link</mat-icon>
      </a>
    </td>
  </ng-container>

  <ng-container matColumnDef="sourcepdf">
    <th mat-header-cell *matHeaderCellDef>PDF</th>
    <td mat-cell *matCellDef="let element">
      <a *ngIf="element.sourcepdf" [href]="element.sourcepdf" target="_blank">
        <mat-icon>picture_as_pdf</mat-icon>
      </a>
      <span *ngIf="!element.sourcepdf">—</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button color="primary" (click)="openForm(element)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="delete(element.id)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="7" style="text-align: center; padding: 16px;">No publications found.</td>
  </tr>
</table>
